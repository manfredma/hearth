# Hearth staging edge route on the shared bytedepth-nginx instance.
# The app service joins the shared network with the unique hearth-app name;
# a generic app alias is forbidden.

server {
    listen 80;
    server_name staging-hearth.bytedepth.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name staging-hearth.bytedepth.cn;

    ssl_certificate     /etc/letsencrypt/live/staging-hearth.bytedepth.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-hearth.bytedepth.cn/privkey.pem;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $hearth_upstream hearth-app:8080;

    location / {
        proxy_pass http://$hearth_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
