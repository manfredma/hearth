services:
  hearth-mysql:
    command: ["mysqld", "--innodb-buffer-pool-size=128M"]
    volumes:
      - ${HEARTH_MYSQL_DATA_DIR:-/opt/hearth/staging/mysql}:/var/lib/mysql

  hearth-redis:
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${HEARTH_REDIS_PASSWORD:?HEARTH_REDIS_PASSWORD must be set}", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - ${HEARTH_REDIS_DATA_DIR:-/opt/hearth/staging/redis}:/data

  hearth-app:
    ports:
      - "127.0.0.1:${HEARTH_APP_PORT:-18083}:8080"
    environment:
      HEARTH_ENVIRONMENT: staging
      HEARTH_OIDC_ISSUER: ${HEARTH_OIDC_ISSUER:?HEARTH_OIDC_ISSUER must be set}
      HEARTH_SIGNING_KEY: ${HEARTH_SIGNING_KEY:?HEARTH_SIGNING_KEY must be set}
      HEARTH_REMEMBER_ME_KEY: ${HEARTH_REMEMBER_ME_KEY:?HEARTH_REMEMBER_ME_KEY must be set}
      HEARTH_REMEMBER_ME_COOKIE_SECURE: "true"
      HEARTH_SESSION_REDIS_NAMESPACE: hearth:staging:session:v1
      HEARTH_SESSION_COOKIE_NAME: HEARTH_STAGING_SESSION
