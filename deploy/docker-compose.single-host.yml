services:
  hearth-mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${HEARTH_MYSQL_ROOT_PASSWORD:?HEARTH_MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: hearth
    volumes:
      - ${HEARTH_MYSQL_DATA_DIR:-/opt/hearth/mysql}:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

  hearth-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${HEARTH_REDIS_PASSWORD:?HEARTH_REDIS_PASSWORD must be set}"]
    environment:
      HEARTH_REDIS_PASSWORD: ${HEARTH_REDIS_PASSWORD:?HEARTH_REDIS_PASSWORD must be set}
    volumes:
      - ${HEARTH_REDIS_DATA_DIR:-/opt/hearth/redis}:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$HEARTH_REDIS_PASSWORD redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  hearth-app:
    build:
      context: ..
      additional_contexts:
        maven-cache: ${HEARTH_MAVEN_CACHE_DIR:-/opt/shared-maven/repository}
      args:
        HEARTH_COMMIT_ID: ${HEARTH_COMMIT_ID:?HEARTH_COMMIT_ID must be set}
        HEARTH_BUILT_AT: ${HEARTH_BUILT_AT:?HEARTH_BUILT_AT must be set}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HEARTH_APP_PORT:-18082}:8080"
    environment:
      HEARTH_ENVIRONMENT: production
      HEARTH_DATASOURCE_URL: jdbc:mysql://hearth-mysql:3306/hearth?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      HEARTH_DATASOURCE_USERNAME: root
      HEARTH_DATASOURCE_PASSWORD: ${HEARTH_MYSQL_ROOT_PASSWORD:?HEARTH_MYSQL_ROOT_PASSWORD must be set}
      HEARTH_REDIS_HOST: hearth-redis
      HEARTH_REDIS_PASSWORD: ${HEARTH_REDIS_PASSWORD:?HEARTH_REDIS_PASSWORD must be set}
      HEARTH_OIDC_ISSUER: ${HEARTH_OIDC_ISSUER:?HEARTH_OIDC_ISSUER must be set}
      HEARTH_SIGNING_KEY: ${HEARTH_SIGNING_KEY:?HEARTH_SIGNING_KEY must be set}
      HEARTH_SESSION_COOKIE_SECURE: "true"
      HEARTH_SESSION_COOKIE_SAME_SITE: lax
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Shanghai --enable-native-access=ALL-UNNAMED
    depends_on:
      hearth-mysql:
        condition: service_healthy
      hearth-redis:
        condition: service_healthy
    networks:
      default:
      bytedepth_default:

networks:
  bytedepth_default:
    external: true
