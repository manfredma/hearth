spring:
  application:
    name: hearth
  datasource:
    url: ${HEARTH_DATASOURCE_URL:jdbc:mysql://localhost:3306/hearth?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
    username: ${HEARTH_DATASOURCE_USERNAME:hearth}
    password: ${HEARTH_DATASOURCE_PASSWORD:}
  session:
    store-type: ${HEARTH_SESSION_STORE_TYPE:redis}
    timeout: ${HEARTH_SESSION_TIMEOUT:60m}
    redis:
      namespace: ${HEARTH_SESSION_REDIS_NAMESPACE:hearth:session:v1}
  data:
    redis:
      host: ${HEARTH_REDIS_HOST:localhost}
      port: ${HEARTH_REDIS_PORT:6379}
      password: ${HEARTH_REDIS_PASSWORD:}

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: ${HEARTH_SESSION_COOKIE_NAME:HEARTH_SESSION}
        http-only: true
        secure: ${HEARTH_SESSION_COOKIE_SECURE:false}
        same-site: ${HEARTH_SESSION_COOKIE_SAME_SITE:lax}

hearth:
  environment: ${HEARTH_ENVIRONMENT:local}
  authentication:
    failure-threshold: ${HEARTH_LOGIN_FAILURE_THRESHOLD:5}
    lock-duration: ${HEARTH_LOGIN_LOCK_DURATION:15m}
  authorization-server:
    issuer: ${HEARTH_OIDC_ISSUER:https://localhost:8080}
    signing-key-location: ${HEARTH_SIGNING_KEY_LOCATION:env:HEARTH_SIGNING_KEY}
    access-token-ttl: ${HEARTH_ACCESS_TOKEN_TTL:5m}
    refresh-token-ttl: ${HEARTH_REFRESH_TOKEN_TTL:30d}
